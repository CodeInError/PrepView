<div class="p-4 flex flex-column gap-4">
  <h2>PrimeNG 19 Component Test</h2>

  <!-- Input Text -->
  <span class="p-float-label">
    <input id="username"  type="text" pInputText />
    <!-- <label for="username">Username</label> -->
  </span>

  <!-- Checkbox -->
  <p-checkbox binary="true" label="Accept Terms"></p-checkbox>

  <!-- Dropdown -->
  <p-dropdown
    [options]="cities"
    optionLabel="name"
    placeholder="Select City">
  </p-dropdown>

  <!-- Button -->
  <button
    pButton
    label="Open Dialog"
    (click)="showDialog = true">
  </button>

  <!-- Dialog -->
  <p-dialog
    header="PrimeNG Dialog"
    [(visible)]="showDialog"
    [modal]="true"
    [style]="{ width: '25rem' }">
    <p>
      If this dialog opens with animation, PrimeNG is fully working 🎉
    </p>
  </p-dialog>
</div>



<router-outlet />
